name: LVGL 2.1 firmware compile

on:
  pull_request:
    paths:
      - 'firmware/boards/21/**'
      - 'firmware/libraries/**'
      - 'firmware/build.py'
      - '.github/workflows/lvgl-firmware-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-21:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Cache ESP32 Arduino core and libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: esp32s3-3.3.10-lvgl-8.3.10-v1
      - name: Install exact ESP32 core
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.10 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Build 2.1 firmware without flashing
        run: python3 firmware/build.py --board 21 --jobs 2
